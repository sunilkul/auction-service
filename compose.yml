services:
  mysql:
    image: mysql:8.0
    container_name: epl_auction_mysql
    environment:
      MYSQL_ROOT_PASSWORD: Root@123
      MYSQL_DATABASE: epl_auction
    ports:
      - "3306:3306"
    volumes:
      - epl_auction_data:/var/lib/mysql
      - ./sql-scripts/production/00-MY-SQL-TABLE.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRoot@123"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  epl_auction_data:
